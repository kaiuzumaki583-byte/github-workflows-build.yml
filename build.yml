          package com.videoupscaler.app

          import android.content.Context
          import android.net.Uri
          import java.io.File
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.zip.ZipInputStream

          /**
           * Real-ESRGAN General x4v3 (BSD-3-Clause) as a float TFLite model, published by Qualcomm AI Hub.
           * The download is a small zip that contains the .tflite file.
           */
          object ModelManager {
              const val MODEL_ZIP_URL =
                  "https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/" +
                      "real_esrgan_general_x4v3/releases/v0.67.0/real_esrgan_general_x4v3-tflite-float.zip"

              private fun dir(context: Context) = File(context.filesDir, "models").also { it.mkdirs() }

              fun modelFile(context: Context) = File(dir(context), "sr_model.tflite")

              fun isInstalled(context: Context): Boolean {
                  val f = modelFile(context)
                  return f.exists() && f.length() > 100_000
              }

              fun download(context: Context, onProgress: (Int) -> Unit) {
                  val tmp = File(dir(context), "download.zip")
                  val conn = URL(MODEL_ZIP_URL).openConnection() as HttpURLConnection
                  conn.connectTimeout = 20_000
                  conn.readTimeout = 60_000
                  try {
                      if (conn.responseCode != 200) throw IOException("Download failed (HTTP ${conn.responseCode})")
                      val total = conn.contentLength
                      conn.inputStream.use { input ->
                          tmp.outputStream().use { out ->
                              val buf = ByteArray(64 * 1024)
                              var read: Int
                              var sum = 0L
                              while (input.read(buf).also { read = it } >= 0) {
                                  out.write(buf, 0, read)
                                  sum += read
                                  if (total > 0) onProgress((sum * 100 / total).toInt())
                              }
                          }
                      }
                  } finally {
                      conn.disconnect()
                  }
                  extractTflite(tmp, modelFile(context))
                  tmp.delete()
              }

              /** Lets the user pick a model file themselves (.tflite, or the .zip as downloaded). */
              fun importFromUri(context: Context, uri: Uri) {
                  val tmp = File(dir(context), "import.bin")
                  val input = context.contentResolver.openInputStream(uri) ?: throw IOException("Cannot open that file")
                  input.use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                  val head = ByteArray(2)
                  tmp.inputStream().use { it.read(head) }
                  if (head[0] == 'P'.code.toByte() && head[1] == 'K'.code.toByte()) {
                      extractTflite(tmp, modelFile(context))
                  } else {
                      tmp.copyTo(modelFile(context), overwrite = true)
                  }
                  tmp.delete()
              }

              private fun extractTflite(zip: File, dest: File) {
                  ZipInputStream(zip.inputStream().buffered()).use { zis ->
                      var e = zis.nextEntry
                      while (e != null) {
                          if (!e.isDirectory && e.name.endsWith(".tflite")) {
                              dest.outputStream().use { zis.copyTo(it) }
                              return
                          }
                          e = zis.nextEntry
                      }
                  }
                  throw IOException("No .tflite file found inside the zip")
              }
          }
