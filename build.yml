          package com.videoupscaler.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Environment
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.MediaStore
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.ensureActive
          import kotlinx.coroutines.launch
          import java.io.File
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Runs the upscaling in the background (foreground service) so it survives screen-off and app switching. */
          class UpscaleService : Service() {

              companion object {
                  const val ACTION_START = "com.videoupscaler.app.START"
                  const val ACTION_CANCEL = "com.videoupscaler.app.CANCEL"
                  const val EXTRA_INPUT = "input"
                  const val EXTRA_SHORT_SIDE = "short_side"
                  const val EXTRA_AI = "ai"
                  private const val CHANNEL = "upscale"
                  private const val NOTIF_ID = 1
              }

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private var job: Job? = null
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_CANCEL) {
                      job?.cancel()
                      return START_NOT_STICKY
                  }
                  createChannel()
                  startForeground(
                      NOTIF_ID,
                      buildNotification("Starting…", 0, 0, true),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC,
                  )
                  if (job?.isActive == true) return START_NOT_STICKY

                  val inputPath = intent?.getStringExtra(EXTRA_INPUT)
                  if (intent == null || inputPath == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val shortSide = intent.getIntExtra(EXTRA_SHORT_SIDE, 1080)
                  val useAi = intent.getBooleanExtra(EXTRA_AI, true)

                  wakeLock = (getSystemService(POWER_SERVICE) as PowerManager)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "videoupscaler:job")
                      .apply { acquire(24 * 60 * 60 * 1000L) }

                  job = scope.launch {
                      JobStore.state.value = JobState(running = true, message = "Preparing…")
                      val started = System.currentTimeMillis()
                      var lastNotify = 0L
                      var tempOut: File? = null
                      try {
                          val upscaler: FrameUpscaler =
                              if (useAi) AiUpscaler(ModelManager.modelFile(this@UpscaleService)) else ClassicUpscaler()
                          upscaler.use { up ->
                              val tmp = File(cacheDir, "out_${System.currentTimeMillis()}.mp4")
                              tempOut = tmp
                              val mode = if (useAi) {
                                  "AI" + if ((up as? AiUpscaler)?.usingGpu == true) " (GPU)" else " (CPU)"
                              } else "Classic"
                              val audioOk = VideoUpscaler().run(
                                  File(inputPath), tmp, shortSide, up,
                                  checkCancel = { ensureActive() },
                              ) { done, total ->
                                  val elapsed = (System.currentTimeMillis() - started) / 1000.0
                                  val eta = if (done > 0) (elapsed / done * (total - done)).toLong() else -1L
                                  JobStore.state.value = JobState(
                                      running = true, done = done, total = total, etaSeconds = eta,
                                      message = "$mode upscaling…",
                                  )
                                  val now = System.currentTimeMillis()
                                  if (now - lastNotify > 1000) {
                                      lastNotify = now
                                      postNotification(buildNotification("$mode · frame $done of $total", done, total, false))
                                  }
                              }
                              JobStore.state.value = JobState(running = true, message = "Saving to gallery…")
                              val uri = saveToGallery(tmp)
                              JobStore.state.value = JobState(
                                  running = false,
                                  message = "Done! Saved in Movies/Upscaler." + if (!audioOk) " (No audio was copied.)" else "",
                                  outputUri = uri,
                              )
                          }
                      } catch (e: CancellationException) {
                          JobStore.state.value = JobState(running = false, message = "Cancelled.")
                      } catch (e: Throwable) {
                          JobStore.state.value = JobState(
                              running = false,
                              message = "Failed.",
                              error = (e.message ?: e.javaClass.simpleName),
                          )
                      } finally {
                          tempOut?.delete()
                          File(inputPath).delete()
                          try { wakeLock?.release() } catch (ignored: Throwable) {}
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          val s = JobStore.state.value
                          postNotification(
                              buildNotification(s.error?.let { "Failed: $it" } ?: s.message, 0, 0, false, ongoing = false),
                          )
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  scope.cancel()
                  try { wakeLock?.release() } catch (ignored: Throwable) {}
                  super.onDestroy()
              }

              private fun postNotification(n: Notification) {
                  try {
                      getSystemService(NotificationManager::class.java).notify(NOTIF_ID, n)
                  } catch (ignored: Throwable) {}
              }

              private fun createChannel() {
                  val ch = NotificationChannel(CHANNEL, "Upscaling", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
              }

              private fun buildNotification(
                  text: String,
                  done: Int,
                  total: Int,
                  indeterminate: Boolean,
                  ongoing: Boolean = true,
              ): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT,
                  )
                  val b = NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle("Video Upscaler")
                      .setContentText(text)
                      .setContentIntent(open)
                      .setOngoing(ongoing)
                      .setOnlyAlertOnce(true)
                  if (ongoing) {
                      if (total > 0) b.setProgress(total, done, false) else b.setProgress(0, 0, indeterminate)
                      val cancel = PendingIntent.getService(
                          this, 1, Intent(this, UpscaleService::class.java).setAction(ACTION_CANCEL),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT,
                      )
                      b.addAction(android.R.drawable.ic_menu_close_clear_cancel, "Cancel", cancel)
                  }
                  return b.build()
              }

              private fun saveToGallery(file: File): Uri {
                  val name = "Upscaled_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".mp4"
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, name)
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/Upscaler")
                      put(MediaStore.Video.Media.IS_PENDING, 1)
                  }
                  val resolver = contentResolver
                  val uri = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                      ?: throw IOException("Could not create the file in your gallery")
                  val out = resolver.openOutputStream(uri) ?: throw IOException("Could not write to your gallery")
                  out.use { o -> file.inputStream().use { it.copyTo(o) } }
                  values.clear()
                  values.put(MediaStore.Video.Media.IS_PENDING, 0)
                  resolver.update(uri, values, null, null)
                  return uri
              }
          }
