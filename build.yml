          package com.videoupscaler.app

          import android.graphics.Bitmap
          import android.media.Image
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaCodecList
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMetadataRetriever
          import android.media.MediaMuxer
          import java.io.File
          import java.io.IOException
          import java.nio.ByteBuffer
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          /**
           * Pipeline: read every frame of the video -> upscale it -> encode into a new MP4 with the
           * original audio copied over untouched. Frame timestamps are preserved.
           */
          class VideoUpscaler {

              /** @return true if the audio track was copied into the result. */
              fun run(
                  input: File,
                  output: File,
                  targetShortSide: Int,
                  upscaler: FrameUpscaler,
                  checkCancel: () -> Unit,
                  onProgress: (done: Int, total: Int) -> Unit,
              ): Boolean {
                  // 1. exact timestamp of every video frame
                  val ptsList = ArrayList<Long>()
                  val ex = MediaExtractor()
                  try {
                      ex.setDataSource(input.absolutePath)
                      var vIdx = -1
                      for (i in 0 until ex.trackCount) {
                          val mime = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                          if (mime.startsWith("video/")) {
                              vIdx = i
                              break
                          }
                      }
                      if (vIdx < 0) throw IOException("This file has no video track")
                      ex.selectTrack(vIdx)
                      while (true) {
                          val t = ex.sampleTime
                          if (t < 0) break
                          ptsList.add(t)
                          if (!ex.advance()) break
                      }
                  } finally {
                      ex.release()
                  }
                  val pts = ptsList.sorted().distinct()
                  if (pts.isEmpty()) throw IOException("Could not read any video frames")
                  val total = pts.size

                  val fps = if (total > 1 && pts.last() > pts.first()) {
                      ((total - 1) * 1_000_000.0 / (pts.last() - pts.first())).roundToInt().coerceIn(1, 60)
                  } else 30

                  val mmr = MediaMetadataRetriever()
                  var writer: Mp4Writer? = null
                  try {
                      mmr.setDataSource(input.absolutePath)

                      // 2. first frame decides the output size
                      var firstBmp: Bitmap? = null
                      var k = 0
                      while (firstBmp == null && k < pts.size && k < 30) {
                          firstBmp = mmr.getFrameAtTime(pts[k], MediaMetadataRetriever.OPTION_CLOSEST)
                          k++
                      }
                      val first = toPix(firstBmp ?: throw IOException("Could not decode the first frame"))
                      val scale = targetShortSide.toDouble() / min(first.w, first.h)
                      val outW = even((first.w * scale).roundToInt())
                      val outH = even((first.h * scale).roundToInt())

                      writer = Mp4Writer(output.absolutePath, outW, outH, fps, input)

                      // 3. frame loop
                      var lastSrc: Pix? = null
                      var lastUp: Pix? = null
                      for ((i, t) in pts.withIndex()) {
                          checkCancel()
                          val bmp = if (i == 0) null else mmr.getFrameAtTime(t, MediaMetadataRetriever.OPTION_CLOSEST)
                          val src: Pix = when {
                              i == 0 -> first
                              bmp != null -> toPix(bmp)
                              lastSrc != null -> lastSrc
                              else -> throw IOException("Could not decode frame $i")
                          }
                          val up: Pix =
                              if (lastSrc != null && lastUp != null && src.w == lastSrc.w && src.h == lastSrc.h &&
                                  src.data.contentEquals(lastSrc.data)
                              ) {
                                  lastUp // identical to the previous frame: reuse
                              } else {
                                  val raw = upscaler.upscale(src, outW, outH)
                                  raw
                              }
                          lastSrc = src
                          lastUp = up
                          writer.feed(up.data, t)
                          onProgress(i + 1, total)
                      }

                      writer.finish()
                      return writer.audioCopied
                  } finally {
                      try { mmr.release() } catch (ignored: Throwable) {}
                      try { writer?.close() } catch (ignored: Throwable) {}
                  }
              }

              private fun even(v: Int) = if (v % 2 == 0) v else v + 1

              private fun toPix(bmp: Bitmap): Pix {
                  val b = if (bmp.config == Bitmap.Config.ARGB_8888) bmp else bmp.copy(Bitmap.Config.ARGB_8888, false)
                  val w = b.width
                  val h = b.height
                  val arr = IntArray(w * h)
                  b.getPixels(arr, 0, w, 0, 0, w, h)
                  if (b !== bmp) b.recycle()
                  bmp.recycle()
                  return Pix(w, h, arr)
              }
          }

          /** Hardware H.264/H.265 encoder fed with raw frames, muxed into MP4 together with the original audio. */
          private class Mp4Writer(
              outPath: String,
              private val w: Int,
              private val h: Int,
              fps: Int,
              private val audioSource: File?,
          ) : AutoCloseable {

              private val muxer = MediaMuxer(outPath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG4)
              private val info = MediaCodec.BufferInfo()
              private var videoTrack = -1
              private var audioTrack = -1
              private var audioEx: MediaExtractor? = null
              private var muxerStarted = false
              private var muxerStopped = false
              var audioCopied = false
                  private set

              private val codec: MediaCodec = createEncoder(fps)

              private fun createEncoder(fps: Int): MediaCodec {
                  val list = MediaCodecList(MediaCodecList.REGULAR_CODECS)
                  val avc = MediaFormat.MIMETYPE_VIDEO_AVC
                  val hevc = MediaFormat.MIMETYPE_VIDEO_HEVC
                  val mimes = if (max(w, h) > 1920) arrayOf(hevc, avc) else arrayOf(avc, hevc)
                  for (mime in mimes) {
                      val bpp = if (mime == hevc) 0.10 else 0.15
                      val bitrate = (w.toLong() * h * fps * bpp).toLong().coerceIn(3_000_000L, 90_000_000L).toInt()
                      val basic = MediaFormat.createVideoFormat(mime, w, h).apply {
                          setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                          setInteger(MediaFormat.KEY_BIT_RATE, bitrate)
                          setInteger(MediaFormat.KEY_FRAME_RATE, fps)
                          setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                      }
                      val name = list.findEncoderForFormat(basic) ?: continue
                      for (attempt in 0..1) {
                          val c = MediaCodec.createByCodecName(name)
                          try {
                              val fmt = MediaFormat(basic)
                              if (attempt == 0) {
                                  fmt.setInteger(MediaFormat.KEY_MAX_B_FRAMES, 0)
                                  fmt.setInteger(MediaFormat.KEY_COLOR_STANDARD, MediaFormat.COLOR_STANDARD_BT709)
                                  fmt.setInteger(MediaFormat.KEY_COLOR_RANGE, MediaFormat.COLOR_RANGE_LIMITED)
                                  fmt.setInteger(MediaFormat.KEY_COLOR_TRANSFER, MediaFormat.COLOR_TRANSFER_SDR_VIDEO)
                              }
                              c.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                              c.start()
                              return c
                          } catch (e: Exception) {
                              try { c.release() } catch (ignored: Throwable) {}
                          }
                      }
                  }
                  throw IOException("This phone cannot encode ${w}x$h video")
              }

              fun feed(argb: IntArray, ptsUs: Long) {
                  var idx = -1
                  var spins = 0
                  while (idx < 0) {
                      idx = codec.dequeueInputBuffer(10_000)
                      if (idx < 0) {
                          drain(false)
                          if (++spins > 3000) throw IOException("Video encoder stopped responding")
                      }
                  }
                  val image = codec.getInputImage(idx) ?: throw IOException("Encoder does not accept raw frames on this phone")
                  writeYuv(image, argb)
                  codec.queueInputBuffer(idx, 0, w * h * 3 / 2, ptsUs, 0)
                  drain(false)
              }

              fun finish() {
                  var idx = -1
                  var spins = 0
                  while (idx < 0) {
                      idx = codec.dequeueInputBuffer(10_000)
                      if (idx < 0) {
                          drain(false)
                          if (++spins > 3000) throw IOException("Video encoder stopped responding")
                      }
                  }
                  codec.queueInputBuffer(idx, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                  drain(true)
                  writeAudio()
                  muxer.stop()
                  muxerStopped = true
              }

              private fun drain(untilEos: Boolean) {
                  var idle = 0
                  while (true) {
                      val idx = codec.dequeueOutputBuffer(info, if (untilEos) 10_000L else 0L)
                      if (idx == MediaCodec.INFO_TRY_AGAIN_LATER) {
                          if (!untilEos) return
                          if (++idle > 3000) throw IOException("Video encoder did not finish")
                      } else if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          startMuxer(codec.outputFormat)
                      } else if (idx >= 0) {
                          idle = 0
                          val buf = codec.getOutputBuffer(idx)
                          if ((info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0
                          if (info.size > 0 && buf != null) {
                              if (!muxerStarted) throw IllegalStateException("Encoder produced data before its format")
                              buf.position(info.offset)
                              buf.limit(info.offset + info.size)
                              muxer.writeSampleData(videoTrack, buf, info)
                          }
                          codec.releaseOutputBuffer(idx, false)
                          if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) return
                      }
                  }
              }

              private fun startMuxer(videoFormat: MediaFormat) {
                  videoTrack = muxer.addTrack(videoFormat)
                  if (audioSource != null) {
                      val ex = MediaExtractor()
                      try {
                          ex.setDataSource(audioSource.absolutePath)
                          var idx = -1
                          for (i in 0 until ex.trackCount) {
                              val mime = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                              if (mime.startsWith("audio/")) {
                                  idx = i
                                  break
                              }
                          }
                          if (idx >= 0) {
                              audioTrack = muxer.addTrack(ex.getTrackFormat(idx))
                              ex.selectTrack(idx)
                              audioEx = ex
                          } else {
                              ex.release()
                          }
                      } catch (e: Exception) {
                          audioTrack = -1
                          audioEx = null
                          try { ex.release() } catch (ignored: Throwable) {}
                      }
                  }
                  muxer.start()
                  muxerStarted = true
              }

              private fun writeAudio() {
                  val ex = audioEx ?: return
                  if (audioTrack < 0) return
                  val buf = ByteBuffer.allocate(1 shl 20)
                  val bi = MediaCodec.BufferInfo()
                  ex.seekTo(0, MediaExtractor.SEEK_TO_CLOSEST_SYNC)
                  while (true) {
                      val n = ex.readSampleData(buf, 0)
                      if (n < 0) break
                      val flags = if ((ex.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC) != 0)
                          MediaCodec.BUFFER_FLAG_KEY_FRAME else 0
                      bi.set(0, n, ex.sampleTime, flags)
                      muxer.writeSampleData(audioTrack, buf, bi)
                      if (!ex.advance()) break
                  }
                  audioCopied = true
              }

              private fun clamp(v: Int, lo: Int, hi: Int) = if (v < lo) lo else if (v > hi) hi else v

              /** ARGB -> YUV 4:2:0 (BT.709, limited range) straight into the encoder's input image. */
              private fun writeYuv(image: Image, argb: IntArray) {
                  val yp = image.planes[0]
                  val up = image.planes[1]
                  val vp = image.planes[2]
                  val yBuf = yp.buffer
                  val uBuf = up.buffer
                  val vBuf = vp.buffer
                  val yRs = yp.rowStride
                  val yPs = yp.pixelStride
                  val uRs = up.rowStride
                  val uPs = up.pixelStride
                  val vRs = vp.rowStride
                  val vPs = vp.pixelStride

                  var j = 0
                  while (j < h) {
                      var i = 0
                      while (i < w) {
                          var rs = 0
                          var gs = 0
                          var bs = 0
                          for (dy in 0..1) {
                              for (dx in 0..1) {
                                  val c = argb[(j + dy) * w + (i + dx)]
                                  val r = (c shr 16) and 255
                                  val g = (c shr 8) and 255
                                  val b = c and 255
                                  rs += r
                                  gs += g
                                  bs += b
                                  val y = ((47 * r + 157 * g + 16 * b + 128) shr 8) + 16
                                  yBuf.put((j + dy) * yRs + (i + dx) * yPs, clamp(y, 16, 235).toByte())
                              }
                          }
                          val r = rs shr 2
                          val g = gs shr 2
                          val b = bs shr 2
                          val cb = ((-26 * r - 87 * g + 112 * b + 128) shr 8) + 128
                          val cr = ((112 * r - 102 * g - 10 * b + 128) shr 8) + 128
                          uBuf.put((j shr 1) * uRs + (i shr 1) * uPs, clamp(cb, 16, 240).toByte())
                          vBuf.put((j shr 1) * vRs + (i shr 1) * vPs, clamp(cr, 16, 240).toByte())
                          i += 2
                      }
                      j += 2
                  }
              }

              override fun close() {
                  try { codec.stop() } catch (ignored: Throwable) {}
                  try { codec.release() } catch (ignored: Throwable) {}
                  try { if (muxerStarted && !muxerStopped) muxer.stop() } catch (ignored: Throwable) {}
                  try { muxer.release() } catch (ignored: Throwable) {}
                  try { audioEx?.release() } catch (ignored: Throwable) {}
              }
          }
          __EOF__
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
