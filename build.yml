                      <RadioButton
                          android:id="@+id/rb720"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="HD 720p" />

                      <RadioButton
                          android:id="@+id/rb1080"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:text="Full HD 1080p (best for YouTube / TikTok)" />

                      <RadioButton
                          android:id="@+id/rb1440"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="2K 1440p" />

                      <RadioButton
                          android:id="@+id/rb2160"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="4K 2160p" />
                  </RadioGroup>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="3. Method"
                      android:textStyle="bold" />

                  <RadioGroup
                      android:id="@+id/rgMode"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <RadioButton
                          android:id="@+id/rbAi"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:text="AI (sharpest, very slow)" />

                      <RadioButton
                          android:id="@+id/rbClassic"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Classic (fast, less detail)" />
                  </RadioGroup>

                  <TextView
                      android:id="@+id/tvModel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="AI model: checking…" />

                  <Button
                      android:id="@+id/btnDownload"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Download AI model (about 5 MB)" />

                  <Button
                      android:id="@+id/btnImport"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Use my own model file instead"
                      style="@style/Widget.MaterialComponents.Button.TextButton" />

                  <Button
                      android:id="@+id/btnStart"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
