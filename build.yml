name: Build Video Upscaler APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          mkdir -p project
          cd project
          mkdir -p app
          cat > app/build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.videoupscaler.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.videoupscaler.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              // On-device AI super-resolution
              implementation("org.tensorflow:tensorflow-lite:2.14.0")
              implementation("org.tensorflow:tensorflow-lite-gpu:2.14.0")
              implementation("org.tensorflow:tensorflow-lite-gpu-api:2.14.0")
          }
          __EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:label="Video Upscaler"
                  android:largeHeap="true"
                  android:theme="@style/Theme.Upscaler">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".UpscaleService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          __EOF__
          mkdir -p app/src/main/java/com/videoupscaler/app
          cat > app/src/main/java/com/videoupscaler/app/FrameUpscalers.kt <<'__EOF__'
          package com.videoupscaler.app

          import org.tensorflow.lite.DataType
          import org.tensorflow.lite.Interpreter
          import org.tensorflow.lite.gpu.GpuDelegate
          import java.io.File
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          /** A picture as packed ARGB ints. */
          class Pix(val w: Int, val h: Int, val data: IntArray)

          interface FrameUpscaler : AutoCloseable {
              fun upscale(src: Pix, outW: Int, outH: Int): Pix
          }

          /** High quality resizing (Lanczos-3) and sharpening, plain Kotlin. */
          object Resampler {
              private class Taps(val start: IntArray, val count: IntArray, val w: FloatArray, val stride: Int)

              private fun lanczos(x: Double): Double {
                  val ax = abs(x)
                  if (ax < 1e-9) return 1.0
                  if (ax >= 3.0) return 0.0
                  val px = PI * ax
                  return 3.0 * sin(px) * sin(px / 3.0) / (px * px)
              }

              private fun makeTaps(inSize: Int, outSize: Int): Taps {
                  val scale = inSize.toDouble() / outSize
                  val fs = max(1.0, scale)
                  val support = 3.0 * fs
                  val stride = ceil(support * 2).toInt() + 4
                  val start = IntArray(outSize)
                  val count = IntArray(outSize)
                  val w = FloatArray(outSize * stride)
                  for (o in 0 until outSize) {
                      val center = (o + 0.5) * scale
                      val lo = max(0, floor(center - support).toInt())
                      val hi = min(inSize - 1, ceil(center + support).toInt())
                      val n = hi - lo + 1
                      var sum = 0.0
                      val vals = DoubleArray(n)
                      for (i in 0 until n) {
                          vals[i] = lanczos((lo + i + 0.5 - center) / fs)
                          sum += vals[i]
                      }
                      for (i in 0 until n) w[o * stride + i] = (if (sum != 0.0) vals[i] / sum else vals[i]).toFloat()
                      start[o] = lo
                      count[o] = n
                  }
                  return Taps(start, count, w, stride)
              }

              private fun clamp255(v: Float): Int {
                  val i = (v + 0.5f).toInt()
                  return if (i < 0) 0 else if (i > 255) 255 else i
              }

              fun resize(src: Pix, outW: Int, outH: Int): Pix {
                  if (src.w == outW && src.h == outH) return src
                  val tx = makeTaps(src.w, outW)
                  val ty = makeTaps(src.h, outH)
                  val s = src.data
                  val rowLen = outW * 3

                  // horizontal pass
                  val tmp = FloatArray(rowLen * src.h)
                  for (y in 0 until src.h) {
                      val rowBase = y * src.w
                      var o = y * rowLen
                      for (x in 0 until outW) {
                          var r = 0f
                          var g = 0f
                          var b = 0f
                          val st = tx.start[x]
                          val n = tx.count[x]
                          val wb = x * tx.stride
                          for (i in 0 until n) {
                              val p = s[rowBase + st + i]
                              val wt = tx.w[wb + i]
                              r += wt * ((p shr 16) and 255)
                              g += wt * ((p shr 8) and 255)
                              b += wt * (p and 255)
                          }
                          tmp[o] = r
                          tmp[o + 1] = g
                          tmp[o + 2] = b
                          o += 3
                      }
                  }

                  // vertical pass
                  val out = IntArray(outW * outH)
                  val acc = FloatArray(rowLen)
                  for (y in 0 until outH) {
                      java.util.Arrays.fill(acc, 0f)
                      val st = ty.start[y]
                      val n = ty.count[y]
                      val wb = y * ty.stride
                      for (i in 0 until n) {
                          val wt = ty.w[wb + i]
                          val base = (st + i) * rowLen
                          for (k in 0 until rowLen) acc[k] += wt * tmp[base + k]
                      }
                      var k = 0
                      val ob = y * outW
                      for (x in 0 until outW) {
                          out[ob + x] = (255 shl 24) or (clamp255(acc[k]) shl 16) or
                              (clamp255(acc[k + 1]) shl 8) or clamp255(acc[k + 2])
                          k += 3
                      }
                  }
                  return Pix(outW, outH, out)
              }

              /** Unsharp mask with a 3x3 blur. amount ~0.3 = subtle, ~0.8 = strong. */
              fun sharpen(p: Pix, amount: Float): Pix {
                  if (amount <= 0f) return p
                  val w = p.w
                  val h = p.h
                  val src = p.data
                  val out = IntArray(src.size)
                  for (y in 0 until h) {
                      val r0 = max(y - 1, 0) * w
                      val r1 = y * w
                      val r2 = min(y + 1, h - 1) * w
                      for (x in 0 until w) {
                          val xl = max(x - 1, 0)
                          val xr = min(x + 1, w - 1)
                          val c = src[r1 + x]
                          var res = 255 shl 24
                          var shift = 16
                          while (shift >= 0) {
                              val cv = (c shr shift) and 255
                              val blur = (
                                  ((src[r0 + xl] shr shift) and 255) + ((src[r0 + xr] shr shift) and 255) +
                                      ((src[r2 + xl] shr shift) and 255) + ((src[r2 + xr] shr shift) and 255) +
                                      2 * (((src[r0 + x] shr shift) and 255) + ((src[r2 + x] shr shift) and 255) +
                                          ((src[r1 + xl] shr shift) and 255) + ((src[r1 + xr] shr shift) and 255)) +
                                      4 * cv
                                  ) / 16f
                              val v = cv + amount * (cv - blur)
                              res = res or (clamp255(v) shl shift)
                              shift -= 8
                          }
                          out[r1 + x] = res
                      }
                  }
                  return Pix(w, h, out)
              }
          }

          /** Fast mode: Lanczos resize + sharpening. No new detail, but clean and crisp. */
          class ClassicUpscaler(private val sharpenAmount: Float = 0.7f) : FrameUpscaler {
              override fun upscale(src: Pix, outW: Int, outH: Int): Pix =
                  Resampler.sharpen(Resampler.resize(src, outW, outH), sharpenAmount)

              override fun close() {}
          }

          /**
           * AI mode: runs a super-resolution TFLite model (Real-ESRGAN) over overlapping tiles,
           * then resizes the 4x result to the exact target size.
           */
          class AiUpscaler(
              modelFile: File,
              useGpu: Boolean = true,
              private val finalSharpen: Float = 0.25f,
          ) : FrameUpscaler {

              private var gpuDelegate: GpuDelegate? = null
              private val interpreter: Interpreter
              private var nchw = false
              private var tile = 128
              private var scale = 4
              private lateinit var inBuf: ByteBuffer
              private lateinit var outBuf: ByteBuffer
              private lateinit var inArr: FloatArray
              private lateinit var outArr: FloatArray

              var usingGpu = false
                  private set

              init {
                  var ip: Interpreter? = null
                  if (useGpu) {
                      try {
                          val d = GpuDelegate()
                          gpuDelegate = d
                          ip = Interpreter(modelFile, Interpreter.Options().addDelegate(d))
                          readShapes(ip)
                          // warm-up run: proves the GPU path really works on this phone
                          inBuf.rewind()
                          outBuf.rewind()
                          ip.run(inBuf, outBuf)
                          usingGpu = true
                      } catch (t: Throwable) {
                          try { ip?.close() } catch (ignored: Throwable) {}
                          try { gpuDelegate?.close() } catch (ignored: Throwable) {}
                          gpuDelegate = null
                          ip = null
                      }
                  }
                  if (ip == null) {
                      val threads = max(2, Runtime.getRuntime().availableProcessors() - 1)
                      val cpu = Interpreter(modelFile, Interpreter.Options().setNumThreads(threads))
                      readShapes(cpu)
                      ip = cpu
                  }
                  interpreter = checkNotNull(ip)
              }

              private fun readShapes(ip: Interpreter) {
                  val inT = ip.getInputTensor(0)
                  if (inT.dataType() != DataType.FLOAT32) {
                      throw IllegalStateException("The model must be the float32 version (got ${inT.dataType()}).")
                  }
                  val ins = inT.shape()
                  val outs = ip.getOutputTensor(0).shape()
                  if (ins.size != 4 || outs.size != 4) {
                      throw IllegalStateException("Unexpected model shape ${ins.contentToString()}")
                  }
                  nchw = ins[1] == 3 && ins[3] != 3
                  val h = if (nchw) ins[2] else ins[1]
                  val w = if (nchw) ins[3] else ins[2]
                  if (h != w) throw IllegalStateException("Model needs square tiles, got ${w}x$h")
                  val oh = if (nchw) outs[2] else outs[1]
                  tile = h
                  scale = oh / h
                  if (scale < 1) throw IllegalStateException("Model does not enlarge images")
                  val ot = tile * scale
                  inBuf = ByteBuffer.allocateDirect(4 * 3 * tile * tile).order(ByteOrder.nativeOrder())
                  outBuf = ByteBuffer.allocateDirect(4 * 3 * ot * ot).order(ByteOrder.nativeOrder())
                  inArr = FloatArray(3 * tile * tile)
                  outArr = FloatArray(3 * ot * ot)
              }

              private fun clampI(v: Int, lo: Int, hi: Int) = if (v < lo) lo else if (v > hi) hi else v

              private fun to255(v: Float): Int {
                  val i = (v * 255f + 0.5f).toInt()
                  return if (i < 0) 0 else if (i > 255) 255 else i
              }

              override fun upscale(src: Pix, outW: Int, outH: Int): Pix {
                  val s = scale
                  val t = tile
                  val ot = t * s
                  val bigW = src.w * s
                  val bigH = src.h * s
                  val big = IntArray(bigW * bigH)
                  val pad = 8
                  val step = t - 2 * pad
                  val plane = t * t
                  val oplane = ot * ot

                  var ty = 0
                  while (ty < src.h) {
                      var tx = 0
                      while (tx < src.w) {
                          val x0 = tx - pad
                          val y0 = ty - pad

                          // fill the input tile (edges are replicated)
                          for (yy in 0 until t) {
                              val rowBase = clampI(y0 + yy, 0, src.h - 1) * src.w
                              for (xx in 0 until t) {
                                  val p = src.data[rowBase + clampI(x0 + xx, 0, src.w - 1)]
                                  val r = ((p shr 16) and 255) / 255f
                                  val g = ((p shr 8) and 255) / 255f
                                  val b = (p and 255) / 255f
                                  if (nchw) {
                                      val idx = yy * t + xx
                                      inArr[idx] = r
                                      inArr[plane + idx] = g
                                      inArr[2 * plane + idx] = b
                                  } else {
                                      val idx = (yy * t + xx) * 3
                                      inArr[idx] = r
                                      inArr[idx + 1] = g
                                      inArr[idx + 2] = b
                                  }
                              }
                          }
                          inBuf.rewind()
                          inBuf.asFloatBuffer().put(inArr)
                          outBuf.rewind()
                          interpreter.run(inBuf, outBuf)
                          outBuf.rewind()
                          outBuf.asFloatBuffer().get(outArr)

                          // copy only the middle of the output tile (the padded border is discarded)
                          val rw = min(step, src.w - tx)
                          val rh = min(step, src.h - ty)
                          for (yy in 0 until rh * s) {
                              val oy = pad * s + yy
                              val dst = (ty * s + yy) * bigW + tx * s
                              for (xx in 0 until rw * s) {
                                  val ox = pad * s + xx
                                  val r: Float
                                  val g: Float
                                  val b: Float
                                  if (nchw) {
                                      val i = oy * ot + ox
                                      r = outArr[i]
                                      g = outArr[oplane + i]
                                      b = outArr[2 * oplane + i]
                                  } else {
                                      val i = (oy * ot + ox) * 3
                                      r = outArr[i]
                                      g = outArr[i + 1]
                                      b = outArr[i + 2]
                                  }
                                  big[dst + xx] = (255 shl 24) or (to255(r) shl 16) or (to255(g) shl 8) or to255(b)
                              }
                          }
                          tx += step
                      }
                      ty += step
                  }

                  val resized = Resampler.resize(Pix(bigW, bigH, big), outW, outH)
                  return Resampler.sharpen(resized, finalSharpen)
              }

              override fun close() {
                  try { interpreter.close() } catch (ignored: Throwable) {}
                  try { gpuDelegate?.close() } catch (ignored: Throwable) {}
              }
          }
          __EOF__
          mkdir -p app/src/main/java/com/videoupscaler/app
          cat > app/src/main/java/com/videoupscaler/app/JobStore.kt <<'__EOF__'
          package com.videoupscaler.app

          import android.net.Uri
          import kotlinx.coroutines.flow.MutableStateFlow

          /** What the screen shows about the running (or finished) job. */
          data class JobState(
              val running: Boolean = false,
              val done: Int = 0,
              val total: Int = 0,
              val message: String = "",
              val etaSeconds: Long = -1,
              val outputUri: Uri? = null,
              val error: String? = null,
          )

          /** Shared between the background service and the screen. */
          object JobStore {
              val state = MutableStateFlow(JobState())
          }
          __EOF__
          mkdir -p app/src/main/java/com/videoupscaler/app
          cat > app/src/main/java/com/videoupscaler/app/MainActivity.kt <<'__EOF__'
          package com.videoupscaler.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.View
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.lifecycleScope
          import androidx.lifecycle.repeatOnLifecycle
          import com.videoupscaler.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class MainActivity : AppCompatActivity() {

              private lateinit var ui: ActivityMainBinding
              private var inputUri: Uri? = null
              private var busyPreparing = false

              private val pickVideo =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri != null) onVideoChosen(uri)
                  }

              private val pickModel =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri != null) importModel(uri)
                  }

              private val askNotifications =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) {
                      // The job runs either way; this only decides whether the progress notification is visible.
                      beginJob()
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ui = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(ui.root)

                  ui.btnPick.setOnClickListener { pickVideo.launch(arrayOf("video/*")) }
                  ui.btnDownload.setOnClickListener { downloadModel() }
                  ui.btnImport.setOnClickListener { pickModel.launch(arrayOf("*/*")) }
                  ui.btnStart.setOnClickListener { onStartClicked() }
                  ui.btnCancel.setOnClickListener {
                      startService(Intent(this, UpscaleService::class.java).setAction(UpscaleService.ACTION_CANCEL))
                  }
                  ui.rgMode.setOnCheckedChangeListener { _, _ -> refreshModelUi() }
                  refreshModelUi()

                  lifecycleScope.launch {
                      repeatOnLifecycle(Lifecycle.State.STARTED) {
                          JobStore.state.collect { render(it) }
                      }
                  }
              }

              // ---------- video selection ----------

              private fun onVideoChosen(uri: Uri) {
                  inputUri = uri
                  var name = "video"
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (i >= 0 && c.moveToFirst()) name = c.getString(i)
                  }
                  val desc = try {
                      val m = MediaMetadataRetriever()
                      m.setDataSource(this, uri)
                      val w = m.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)
                      val h = m.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)
                      val ms = m.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                      val frames = m.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_FRAME_COUNT)
                      m.release()
                      "$name\n${w}x$h, ${ms / 1000}s" + (frames?.let { ", about $it frames" } ?: "")
                  } catch (e: Exception) {
                      name
                  }
                  ui.tvInput.text = desc
              }

              // ---------- AI model ----------

              private fun refreshModelUi() {
                  val ai = ui.rbAi.isChecked
                  val installed = ModelManager.isInstalled(this)
                  ui.tvModel.visibility = if (ai) View.VISIBLE else View.GONE
                  ui.btnDownload.visibility = if (ai && !installed) View.VISIBLE else View.GONE
                  ui.btnImport.visibility = if (ai && !installed) View.VISIBLE else View.GONE
                  ui.tvModel.text = if (installed) "AI model: installed ✓" else "AI model: not installed yet"
              }

              private fun downloadModel() {
                  ui.btnDownload.isEnabled = false
                  ui.tvModel.text = "Downloading AI model…"
                  lifecycleScope.launch {
                      try {
                          withContext(Dispatchers.IO) {
                              ModelManager.download(applicationContext) { p ->
                                  runOnUiThread { ui.tvModel.text = "Downloading AI model… $p%" }
                              }
                          }
                      } catch (e: Exception) {
                          Toast.makeText(
                              this@MainActivity,
                              "Download failed: ${e.message}. Check your internet and try again.",
                              Toast.LENGTH_LONG,
                          ).show()
                      }
                      ui.btnDownload.isEnabled = true
                      refreshModelUi()
                  }
              }

              private fun importModel(uri: Uri) {
                  lifecycleScope.launch {
                      try {
                          withContext(Dispatchers.IO) { ModelManager.importFromUri(applicationContext, uri) }
                      } catch (e: Exception) {
                          Toast.makeText(this@MainActivity, "Could not use that file: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                      refreshModelUi()
                  }
              }

              // ---------- start / run ----------

              private fun onStartClicked() {
                  if (inputUri == null) {
                      Toast.makeText(this, "Choose a video first", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (ui.rbAi.isChecked && !ModelManager.isInstalled(this)) {
                      Toast.makeText(this, "Download the AI model first (or pick Classic)", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      askNotifications.launch(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      beginJob()
                  }
              }

              private fun beginJob() {
                  val uri = inputUri ?: return
                  if (busyPreparing || JobStore.state.value.running) return
                  busyPreparing = true
                  ui.btnStart.isEnabled = false
                  ui.tvStatus.text = "Copying the video…"
                  val short = when {
                      ui.rb720.isChecked -> 720
                      ui.rb1440.isChecked -> 1440
                      ui.rb2160.isChecked -> 2160
                      else -> 1080
                  }
                  val ai = ui.rbAi.isChecked
                  lifecycleScope.launch {
                      try {
                          val copy = File(cacheDir, "input.mp4")
                          withContext(Dispatchers.IO) {
                              val input = contentResolver.openInputStream(uri) ?: throw IllegalStateException("Cannot open the video")
                              input.use { i -> copy.outputStream().use { o -> i.copyTo(o) } }
                          }
                          val intent = Intent(this@MainActivity, UpscaleService::class.java)
                              .setAction(UpscaleService.ACTION_START)
                              .putExtra(UpscaleService.EXTRA_INPUT, copy.absolutePath)
                              .putExtra(UpscaleService.EXTRA_SHORT_SIDE, short)
                              .putExtra(UpscaleService.EXTRA_AI, ai)
                          JobStore.state.value = JobState(running = true, message = "Starting…")
                          ContextCompat.startForegroundService(this@MainActivity, intent)
                      } catch (e: Exception) {
                          ui.tvStatus.text = "Could not start: ${e.message}"
                          ui.btnStart.isEnabled = true
                      } finally {
                          busyPreparing = false
                      }
                  }
              }

              // ---------- screen state ----------

              private fun render(s: JobState) {
                  ui.btnStart.isEnabled = !s.running && !busyPreparing
                  ui.btnCancel.isEnabled = s.running
                  if (s.total > 0) {
                      ui.progress.max = s.total
                      ui.progress.progress = s.done
                      ui.progress.isIndeterminate = false
                  } else {
                      ui.progress.isIndeterminate = s.running
                      if (!s.running) ui.progress.progress = 0
                  }
                  val sb = StringBuilder(s.message)
                  if (s.running && s.total > 0) {
                      sb.append("\nFrame ${s.done} of ${s.total}")
                      if (s.etaSeconds >= 0) sb.append("\nTime left: ").append(formatEta(s.etaSeconds))
                      sb.append("\nYou can leave the app or turn off the screen. It keeps working.")
                  }
                  if (s.error != null) sb.append("\n").append(s.error)
                  ui.tvStatus.text = sb.toString()

                  val out = s.outputUri
                  ui.btnOpen.visibility = if (out != null) View.VISIBLE else View.GONE
                  ui.btnOpen.setOnClickListener {
                      if (out != null) {
                          startActivity(
                              Intent(Intent.ACTION_VIEW)
                                  .setDataAndType(out, "video/mp4")
                                  .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION),
                          )
                      }
                  }
              }

              private fun formatEta(sec: Long): String {
                  val h = sec / 3600
                  val m = (sec % 3600) / 60
                  return if (h > 0) "${h}h ${m}m" else if (m > 0) "${m}m" else "${sec}s"
              }
          }
